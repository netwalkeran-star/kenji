<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta property="og:title" content="AI 名片戰情室 (Personal Edition)">
    <meta property="og:description" content="基於 Gemini 2.5 的人脈資產管理系統。支援 OCR 識別、雲端同步與 Logo 視覺化分析。">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    
    <title>AI 名片實驗室 (V16.17 - Full Disclosure)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* [Theme] 明亮工程系 - 高視能優化版 */
        body { 
            background-color: #f1f5f9; 
            background-image: linear-gradient(#cbd5e1 1px, transparent 1px), linear-gradient(90deg, #cbd5e1 1px, transparent 1px);
            background-size: 24px 24px; 
            color: #0f172a; 
            font-family: 'Segoe UI', 'Roboto', monospace;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent; 
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            font-size: 16px; 
        }
        
        input, textarea { -webkit-user-select: text; user-select: text; }

        .page { display: none; padding-bottom: 100px; animation: fadeIn 0.2s ease-out; }
        .page.active { display: block; }
        
        .glass {
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(10px);
            border: 2px solid #94a3b8; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .next-action {
            border: 3px solid #f97316 !important; 
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.2) !important;
            position: relative;
        }
        
        .logo-box {
            width: 56px; height: 56px; 
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px; font-weight: 800; font-size: 24px;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            background: #2563eb; 
        }

        .spinner {
            border: 4px solid #e2e8f0;
            border-left-color: #2563eb;
            border-radius: 50%; width: 32px; height: 32px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .input-field {
            width: 100%; background: #ffffff; padding: 12px 16px; 
            border-radius: 8px; border: 2px solid #cbd5e1; color: #0f172a;
            font-family: monospace; font-size: 16px; font-weight: 500;
            transition: all 0.2s;
        }
        .input-field:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); outline: none; }
        .label-text { font-size: 14px; font-weight: 700; color: #475569; margin-bottom: 6px; display: block; text-transform: uppercase; }
        
        #toast {
            visibility: hidden; min-width: 280px; background-color: #1e293b; color: #fff; text-align: center; border-radius: 12px; padding: 16px; position: fixed; z-index: 100; left: 50%; bottom: 120px; transform: translateX(-50%); font-size: 16px; font-weight: bold; opacity: 0; transition: opacity 0.3s; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        #toast.show { visibility: visible; opacity: 1; }

        .camera-fallback-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; height: 100%; background: #f8fafc; border: 3px dashed #94a3b8; border-radius: 16px;
            color: #475569; cursor: pointer; transition: all 0.2s;
        }
        .camera-fallback-btn:active { background: #e2e8f0; border-color: #64748b; }
        .copy-active { background-color: #e0e7ff !important; border-color: #3b82f6 !important; transform: scale(0.98); transition: all 0.1s; }
    </style>
</head>
<body>

    <div id="toast">Notification</div>

    <!-- ================= MODALS ================= -->

    <!-- 1. 設定 -->
    <div id="modal-settings" class="fixed inset-0 z-50 bg-slate-800/90 flex items-center justify-center p-6 hidden">
        <div class="glass w-full max-w-sm p-6 border-t-8 border-blue-600 shadow-2xl">
            <h2 class="text-2xl font-bold text-slate-900 mb-2 font-mono">系統初始化</h2>
            <p class="text-sm text-slate-600 mb-6 font-bold">請輸入 V16 核心參數</p>
            <label class="label-text">Gemini API Key</label>
            <input id="key-ai" type="password" class="input-field mb-4 font-mono">
            <label class="label-text">Google Apps Script URL</label>
            <input id="key-gas" type="text" class="input-field mb-6 font-mono">
            <button onclick="saveKeys()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-bold text-lg transition-colors next-action">確認啟動</button>
        </div>
    </div>

    <!-- 2. 刪除確認 -->
    <div id="modal-confirm-delete" class="fixed inset-0 z-[60] bg-slate-900/90 flex items-center justify-center p-6 hidden">
        <div class="glass w-full max-w-sm p-6 border-t-8 border-red-500 shadow-2xl animate-[fadeIn_0.2s_ease-out]">
            <h2 class="text-2xl font-bold text-red-600 mb-4 font-mono">⚠ 警告</h2>
            <p class="text-lg text-slate-800 mb-8 font-bold">確定要永久刪除這張名片嗎？<br><span class="text-sm text-slate-500 font-normal">這會同步刪除雲端資料。</span></p>
            <div class="flex gap-4">
                <button onclick="document.getElementById('modal-confirm-delete').classList.add('hidden')" class="flex-1 py-4 bg-slate-200 hover:bg-slate-300 rounded-xl font-bold text-slate-700 text-lg">取消</button>
                <button onclick="executeDelete()" class="flex-1 py-4 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold shadow-lg text-lg">刪除</button>
            </div>
        </div>
    </div>

    <!-- 3. 單筆詳情 (List Click) -->
    <div id="modal-single-card" class="fixed inset-0 z-[55] bg-slate-900/90 hidden flex items-center justify-center p-4">
        <div class="glass w-full max-w-sm p-6 relative animate-[fadeIn_0.2s_ease-out] border-l-8 border-blue-500 max-h-[90vh] overflow-y-auto">
            <button onclick="document.getElementById('modal-single-card').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-2"><i class="fa-solid fa-xmark text-3xl"></i></button>
            <h3 class="text-sm font-bold text-blue-600 font-mono mb-4 uppercase tracking-widest">Asset Detail (Long press to copy)</h3>
            <div id="single-card-content" class="space-y-6"></div>
        </div>
    </div>

    <!-- 4. Logo牆詳情 (Cluster Click) -->
    <div id="modal-detail" class="fixed inset-0 z-[55] bg-slate-900/90 hidden flex flex-col">
        <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800">
            <h3 id="detail-title" class="font-bold text-lg text-white font-mono">CLUSTER DETAILS</h3>
            <button onclick="closeDetail()" class="w-8 h-8 rounded-full bg-slate-700 text-white flex items-center justify-center hover:bg-slate-600"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="detail-content" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-100"></div>
        <div class="p-4 border-t border-slate-200 bg-white">
            <button onclick="exportCurrentGroup()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded font-bold text-sm font-mono">EXPORT CSV</button>
        </div>
    </div>

    <!-- 5. 新增選單 -->
    <div id="action-sheet-add" class="fixed inset-0 z-50 bg-black/60 hidden flex flex-col justify-end" onclick="this.classList.add('hidden')">
        <div class="bg-white rounded-t-3xl p-6" onclick="event.stopPropagation()">
            <div class="text-center text-slate-500 text-sm font-bold mb-6 tracking-widest">-- 選擇建檔方式 --</div>
            <div class="grid grid-cols-2 gap-6">
                <button onclick="goScan()" class="p-6 bg-blue-50 rounded-2xl flex flex-col items-center gap-3 hover:bg-blue-100 border-2 border-blue-200 shadow-md">
                    <div class="w-14 h-14 rounded-full bg-blue-600 text-white flex items-center justify-center"><i class="fa-solid fa-camera text-2xl"></i></div>
                    <span class="text-lg font-bold text-slate-800">拍照識別</span>
                </button>
                <button onclick="goManual()" class="p-6 bg-green-50 rounded-2xl flex flex-col items-center gap-3 hover:bg-green-100 border-2 border-green-200 shadow-md">
                    <div class="w-14 h-14 rounded-full bg-green-600 text-white flex items-center justify-center"><i class="fa-solid fa-keyboard text-2xl"></i></div>
                    <span class="text-lg font-bold text-slate-800">手動輸入</span>
                </button>
            </div>
            <button onclick="document.getElementById('action-sheet-add').classList.add('hidden')" class="w-full mt-6 py-4 text-slate-500 font-bold border-t-2 border-slate-100 text-lg">取 消</button>
        </div>
    </div>

    <!-- 導航 -->
    <nav class="fixed bottom-0 w-full glass flex justify-around p-3 z-40 border-t-2 border-slate-300 pb-8 bg-white/95">
        <button onclick="go('home')" class="flex flex-col items-center w-20 py-1 text-slate-500 hover:text-blue-700">
            <i class="fa-solid fa-chart-pie text-2xl mb-1"></i> <span class="text-xs font-bold">總覽</span>
        </button>
        <button onclick="showAddMenu()" class="flex flex-col items-center justify-center w-16 h-16 bg-blue-600 rounded-full text-white -mt-10 shadow-xl shadow-blue-500/30 border-4 border-[#f1f5f9] active:scale-95 transition-transform next-action">
            <i class="fa-solid fa-plus text-3xl"></i>
        </button>
        <button onclick="go('list')" class="flex flex-col items-center w-20 py-1 text-slate-500 hover:text-blue-700">
            <i class="fa-solid fa-list-ul text-2xl mb-1"></i> <span class="text-xs font-bold">清單</span>
        </button>
        <button onclick="go('wall')" class="flex flex-col items-center w-20 py-1 text-slate-500 hover:text-blue-700">
            <i class="fa-solid fa-layer-group text-2xl mb-1"></i> <span class="text-xs font-bold">Logo牆</span>
        </button>
    </nav>

    <div class="container mx-auto px-4 pt-6 max-w-lg pb-32">

        <!-- 首頁 -->
        <div id="page-home" class="page active">
            <header class="flex justify-between items-end mb-8">
                <div>
                    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">戰情儀表板</h1>
                    <p class="text-sm text-blue-700 font-bold mt-1">V16.17 FULL DISCLOSURE</p>
                </div>
                <div onclick="document.getElementById('modal-settings').classList.remove('hidden')" class="w-12 h-12 rounded-xl bg-white border-2 border-slate-300 flex items-center justify-center cursor-pointer shadow-sm">
                    <i class="fa-solid fa-gear text-xl text-slate-600"></i>
                </div>
            </header>

            <div class="glass p-6 mb-8 border-l-8 border-blue-600 bg-white">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-sm font-bold text-slate-500 uppercase">總資產 (Total)</p>
                        <h2 id="stat-total" class="text-5xl font-extrabold text-slate-900 mt-2 font-mono">0</h2>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-bold text-slate-500 uppercase">待同步 (Queue)</p>
                        <h2 id="stat-unsync" class="text-3xl font-bold text-orange-600 mt-2 font-mono">Ready</h2>
                    </div>
                </div>
                <div class="h-3 w-full bg-slate-200 rounded-full overflow-hidden border border-slate-300">
                    <div id="stat-bar" class="h-full bg-blue-600 w-0 transition-all duration-1000"></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-6">
                <button onclick="goManual()" class="glass p-6 text-left hover:border-blue-500 transition-all group next-action bg-white">
                    <div class="w-12 h-12 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center mb-4 border border-blue-200">
                        <i class="fa-solid fa-pen-nib text-2xl"></i>
                    </div>
                    <h3 class="font-bold text-lg text-slate-800">手動建檔</h3>
                    <p class="text-sm text-slate-500 font-mono mt-1">Manual Entry</p>
                </button>
                <button onclick="downloadData()" class="glass p-6 text-left hover:border-purple-500 transition-all group bg-white">
                    <div id="btn-download-icon" class="w-12 h-12 rounded-xl bg-purple-100 text-purple-700 flex items-center justify-center mb-4 border border-purple-200">
                        <i class="fa-solid fa-cloud-arrow-down text-2xl"></i>
                    </div>
                    <h3 class="font-bold text-lg text-slate-800">雲端下載</h3>
                    <p class="text-sm text-slate-500 font-mono mt-1">Pull & Sync</p>
                </button>
            </div>
            
            <button onclick="uploadAll()" class="w-full mt-8 glass p-4 text-center text-sm font-bold text-slate-700 hover:text-blue-700 hover:border-blue-500 font-mono transition-colors bg-white border-2 border-slate-300">
                <i class="fa-solid fa-upload mr-2"></i> 執行上傳交割 (BATCH PUSH)
            </button>
        </div>

        <!-- 掃描頁 -->
        <div id="page-scan" class="page">
            <div class="flex items-center justify-between mb-6">
                <button onclick="go('home')" class="text-slate-600 hover:text-blue-700 font-bold text-lg"><i class="fa-solid fa-arrow-left"></i> 返回</button>
                <h2 id="editor-title" class="font-bold text-xl text-slate-900 font-mono">INPUT SOURCE</h2>
                <div class="w-10"></div>
            </div>

            <div id="step-camera" class="relative rounded-2xl overflow-hidden shadow-xl border-4 border-slate-300 aspect-[3/4] bg-slate-100 mb-8 hidden">
                <video id="video" autoplay playsinline muted class="w-full h-full object-cover opacity-90"></video>
                <canvas id="canvas" class="hidden"></canvas>
                
                <div id="camera-fallback-ui" class="absolute inset-0 z-20 hidden p-8">
                    <label class="camera-fallback-btn">
                        <i class="fa-solid fa-camera text-6xl mb-4 text-blue-500"></i>
                        <h3 class="font-bold text-xl text-slate-700">點擊啟動相機</h3>
                        <p class="text-sm text-slate-500 mt-2 text-center font-bold">APK / Web 兼容模式</p>
                        <input type="file" accept="image/*" class="hidden" onchange="loadFile(this)">
                    </label>
                </div>

                <div class="absolute bottom-8 w-full flex justify-center gap-8 px-8 pointer-events-auto items-center z-10" id="video-controls">
                    <label class="w-16 h-16 rounded-full bg-slate-800 flex items-center justify-center text-white cursor-pointer shadow-lg active:scale-95 transition-transform border-4 border-white">
                        <i class="fa-solid fa-image text-xl"></i>
                        <input type="file" accept="image/*" class="hidden" onchange="loadFile(this)">
                    </label>
                    <button onclick="takePhoto()" id="btn-snap" class="w-20 h-20 rounded-full bg-white border-8 border-slate-300 flex items-center justify-center active:scale-95 transition-transform shadow-xl">
                        <div class="w-16 h-16 rounded-full bg-red-500 border-4 border-white"></div>
                    </button>
                    <div class="w-16"></div>
                </div>
            </div>

            <div id="step-loading" class="hidden flex-col items-center justify-center py-24 text-center">
                <div class="spinner mb-6 border-slate-300 border-l-blue-600 scale-150"></div>
                <h3 class="text-xl font-bold text-slate-800 font-mono">AI 分析中...</h3>
                <p class="text-sm text-slate-500 mt-2 font-bold">正在讀取文字與 Logo</p>
            </div>

            <div id="step-edit" class="hidden pb-20">
                <input type="hidden" id="edit-id" value="">
                <div class="glass p-6 mb-6 border-l-8 border-blue-600 bg-white">
                    <label class="label-text text-blue-700 text-base">識別主體 (Logo)</label>
                    <input id="edit-logo" class="input-field text-xl font-bold mb-4 bg-blue-50 border-blue-200" placeholder="e.g. TSMC">
                    <label class="label-text text-base">公司全銜</label>
                    <input id="edit-company" class="input-field text-slate-700 font-bold" placeholder="Full Company Name">
                </div>

                <div class="space-y-4">
                    <div class="flex gap-3">
                        <div class="flex-1">
                            <label class="label-text">姓名</label>
                            <input id="edit-name" class="input-field font-bold">
                        </div>
                        <div class="flex-1">
                            <label class="label-text">職稱</label>
                            <input id="edit-title" class="input-field">
                        </div>
                    </div>
                    <div class="p-4 rounded-xl bg-white border-2 border-slate-300 shadow-sm">
                        <label class="label-text mb-3 block text-blue-600"><i class="fa-solid fa-phone mr-1"></i> 電話通訊</label>
                        <div class="grid gap-3">
                            <input id="edit-mobile" class="input-field" placeholder="手機 (Mobile)">
                            <div class="flex gap-3">
                                <input id="edit-phone1" class="input-field" placeholder="電話 1 (主)">
                                <input id="edit-phone2" class="input-field" placeholder="電話 2 (副)">
                            </div>
                        </div>
                    </div>
                    <div class="p-4 rounded-xl bg-white border-2 border-slate-300 shadow-sm">
                        <label class="label-text mb-3 block text-blue-600"><i class="fa-solid fa-map-pin mr-1"></i> 地址資訊</label>
                        <input id="edit-address1" class="input-field mb-3" placeholder="地址 1 (HQ)">
                        <input id="edit-address2" class="input-field" placeholder="地址 2 (Branch)">
                    </div>
                    <div>
                        <label class="label-text">電子郵件</label>
                        <input id="edit-email" class="input-field">
                    </div>
                    <div>
                        <label class="label-text">備註 (搜尋關鍵字)</label>
                        <textarea id="edit-note" rows="4" class="input-field text-sm font-mono text-slate-600 leading-relaxed"></textarea>
                    </div>
                </div>

                <button onclick="saveCard()" class="w-full mt-8 bg-green-600 hover:bg-green-700 text-white py-4 rounded-xl font-bold shadow-xl flex items-center justify-center gap-2 font-mono text-lg next-action">
                    <i class="fa-solid fa-floppy-disk"></i> 存檔並上傳
                </button>
            </div>
        </div>

        <!-- 清單 -->
        <div id="page-list" class="page">
            <div class="sticky top-0 bg-[#f1f5f9] z-10 pb-4 pt-2">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-400 text-lg"></i>
                    <input id="search-bar" oninput="renderList()" placeholder="搜尋關鍵字..." class="w-full bg-white pl-12 pr-4 py-3 rounded-xl border-2 border-slate-300 text-base font-bold focus:border-blue-500 outline-none shadow-sm text-slate-800">
                </div>
            </div>
            <div id="card-list-container" class="space-y-4"></div>
        </div>

        <!-- Logo牆 -->
        <div id="page-wall" class="page">
            <h2 class="text-xl font-bold mb-6 flex items-center gap-3 text-slate-800 font-mono">
                <i class="fa-solid fa-border-all text-blue-600 text-2xl"></i> BRAND MATRIX
            </h2>
            <div id="logo-grid" class="grid grid-cols-3 gap-4"></div>
        </div>

    </div>

    <script>
        const STORAGE_KEY = 'card_manager_db_core';
        let db = [];
        let config = {
            geminiKey: localStorage.getItem('gemini_key_v15') || '', 
            gasUrl: localStorage.getItem('gas_url_v15') || ''
        };
        let activeGroup = [];
        let editingId = null; 
        let pendingDeleteId = null; 

        document.addEventListener('DOMContentLoaded', () => {
            loadAndMigrateData(); 
            const modal = document.getElementById('modal-settings');
            if(!config.geminiKey && modal) modal.classList.remove('hidden');
            updateStats();
            renderList();
        });

        function loadAndMigrateData() {
            const coreData = localStorage.getItem(STORAGE_KEY);
            if (coreData) { db = JSON.parse(coreData); }
        }
        function saveToLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); updateStats(); }

        function go(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            if (pageId === 'wall') renderLogoWall();
            if (pageId === 'list') renderList();
            if (pageId === 'home') updateStats();
            if (pageId === 'scan' && !document.getElementById('step-camera').classList.contains('hidden')) {
                initCamera();
            }
        }

        function showAddMenu() { document.getElementById('action-sheet-add').classList.remove('hidden'); }

        function goScan() {
            document.getElementById('action-sheet-add').classList.add('hidden');
            document.getElementById('editor-title').innerText = "> AI SCANNER";
            resetEditor();
            go('scan');
            document.getElementById('step-camera').classList.remove('hidden');
            initCamera();
        }

        function goManual() {
            document.getElementById('action-sheet-add').classList.add('hidden');
            document.getElementById('editor-title').innerText = "> MANUAL INPUT";
            resetEditor();
            go('scan');
            document.getElementById('step-camera').classList.add('hidden');
            document.getElementById('step-edit').classList.remove('hidden');
            
            // [V16.17 Feature] 手動建檔標記
            document.getElementById('edit-note').value = `[手動建檔 ${new Date().toLocaleDateString()}]`;
        }

        function goEdit(docId) {
            const card = db.find(c => String(c.docId) === String(docId));
            if(!card) return alert('Asset not found in Local DB.');
            document.getElementById('editor-title').innerText = "> EDIT ASSET";
            editingId = docId;
            ['logo','company','name','title','mobile','phone1','phone2','email','address1','address2','note'].forEach(key => {
                const el = document.getElementById('edit-' + key);
                if(el) el.value = card[key] || '';
            });
            go('scan');
            document.getElementById('step-camera').classList.add('hidden');
            document.getElementById('step-edit').classList.remove('hidden');
        }

        function resetEditor() {
            editingId = null;
            document.querySelectorAll('#step-edit input, #step-edit textarea').forEach(i => i.value = '');
            const loading = document.getElementById('step-loading');
            loading.classList.add('hidden');
            loading.style.display = ''; 
            document.getElementById('step-edit').classList.add('hidden');
        }

        function saveKeys() {
            config.geminiKey = document.getElementById('key-ai').value;
            config.gasUrl = document.getElementById('key-gas').value;
            localStorage.setItem('gemini_key_v15', config.geminiKey);
            localStorage.setItem('gas_url_v15', config.gasUrl);
            document.getElementById('modal-settings').classList.add('hidden');
            showToast("Keys Updated.");
        }

        async function initCamera() {
            const video = document.getElementById('video');
            const fallbackUI = document.getElementById('camera-fallback-ui');
            const controls = document.getElementById('video-controls');
            if(fallbackUI) fallbackUI.classList.add('hidden');
            if(controls) controls.classList.remove('hidden');

            try {
                const constraints = { video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                if (video) {
                    video.srcObject = stream;
                    video.onloadedmetadata = () => { video.play().catch(e => console.log("Autoplay blocked:", e)); };
                }
            } catch(e) { 
                console.warn('Camera Failed:', e);
                if(fallbackUI) fallbackUI.classList.remove('hidden');
                if(controls) controls.classList.add('hidden');
            }
        }

        function takePhoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            processImage(canvas.toDataURL('image/jpeg', 0.8));
        }

        function loadFile(input) {
            if (input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => processImage(e.target.result);
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function processImage(base64) {
            document.getElementById('step-camera').classList.add('hidden');
            const loading = document.getElementById('step-loading');
            loading.classList.remove('hidden');
            loading.style.display = 'flex';

            try {
                const cleanBase64 = base64.split(',')[1];
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${config.geminiKey}`;
                const prompt = `請分析名片，回傳JSON: {"logo":"","company":"","name":"","title":"","mobile":"","phone1":"","phone2":"","email":"","address1":"","address2":"","all_text":""}.`;

                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: cleanBase64 } }] }],
                        generationConfig: { response_mime_type: "application/json" }
                    })
                });

                const data = await res.json();
                const result = JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim());

                ['logo','company','name','title','mobile','phone1','phone2','email','address1','address2'].forEach(key => {
                    document.getElementById('edit-' + key).value = result[key] || '';
                });
                
                // [V16.17 Feature] AI 辨識標記
                const sourceTag = `\n[AI 辨識 ${new Date().toLocaleDateString()}]`;
                document.getElementById('edit-note').value = (result.all_text || '') + sourceTag;

                loading.classList.add('hidden');
                loading.style.display = ''; 
                document.getElementById('step-edit').classList.remove('hidden');

            } catch (err) {
                alert('OCR Error: ' + err.message);
                goManual();
            }
        }

        async function saveCard() {
            const cardData = {
                logo: document.getElementById('edit-logo').value,
                company: document.getElementById('edit-company').value,
                name: document.getElementById('edit-name').value,
                title: document.getElementById('edit-title').value,
                mobile: document.getElementById('edit-mobile').value,
                phone1: document.getElementById('edit-phone1').value,
                phone2: document.getElementById('edit-phone2').value,
                email: document.getElementById('edit-email').value,
                address1: document.getElementById('edit-address1').value,
                address2: document.getElementById('edit-address2').value,
                note: document.getElementById('edit-note').value,
                date: new Date().toISOString(),
                synced: false
            };

            if (editingId) {
                const index = db.findIndex(c => String(c.docId) == String(editingId));
                if (index > -1) {
                    cardData.docId = String(editingId);
                    db[index] = cardData;
                }
            } else {
                cardData.docId = String(Date.now());
                db.unshift(cardData);
            }

            saveToLocal(); 
            uploadSingleCard(cardData);
            showToast('Asset Saved Locally.');
            resetEditor();
            go('list');
        }

        function confirmDelete(docId) {
            pendingDeleteId = String(docId);
            document.getElementById('modal-confirm-delete').classList.remove('hidden');
        }

        async function executeDelete() {
            if(!pendingDeleteId) return;
            const idx = db.findIndex(c => String(c.docId) === pendingDeleteId);
            
            if (idx > -1) {
                db.splice(idx, 1);
                saveToLocal();
                document.getElementById('modal-confirm-delete').classList.add('hidden');
                document.getElementById('modal-detail').classList.add('hidden');
                document.getElementById('modal-single-card').classList.add('hidden');
                renderList();
                renderLogoWall(); 
                updateStats();
                showToast('Deleted (Local). Syncing...');
                syncDelete(pendingDeleteId);
            } else {
                alert('Error: Asset not found. Refreshing...');
                location.reload();
            }
            pendingDeleteId = null;
        }

        async function syncDelete(docId) {
            if (!config.gasUrl) return;
            try {
                await fetch(config.gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'delete', docId: String(docId) })
                });
                showToast('Cloud Sync: Deletion Sent.');
            } catch(e) { console.error(e); }
            finally { updateStats(); }
        }

        async function uploadSingleCard(card) {
            if (!config.gasUrl) return;
            try {
                await fetch(config.gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(card)
                });
                card.synced = true;
                saveToLocal();
            } catch(e) { console.error('Push Fail', e); }
        }

        async function uploadAll() {
            const unsync = db.filter(c => !c.synced);
            if(unsync.length === 0) return showToast('All Synced.');
            const btn = document.querySelector('button[onclick="uploadAll()"]');
            btn.innerText = `PUSHING (${unsync.length})...`;
            for(let card of unsync) { await uploadSingleCard(card); }
            btn.innerHTML = `<i class="fa-solid fa-upload mr-2"></i> 執行上傳交割 (BATCH PUSH)`;
            showToast('Batch Complete.');
        }

        async function downloadData() {
            if (!config.gasUrl) return showToast('Err: Endpoint Undefined');
            const btnIcon = document.getElementById('btn-download-icon');
            btnIcon.innerHTML = `<div class="spinner border-purple-500 border-l-transparent"></div>`;
            try {
                const res = await fetch(config.gasUrl + '?action=get');
                const cloudData = await res.json();
                let count = 0;
                const localIds = new Set(db.map(c => String(c.docId)));
                cloudData.forEach(c => {
                    if (!localIds.has(String(c.docId))) {
                        c.synced = true;
                        c.docId = String(c.docId);
                        db.push(c);
                        count++;
                    }
                });
                saveToLocal();
                showToast(`Pull: ${count} assets added.`);
                renderList(); 
            } catch(e) { showToast('Pull Failed: ' + e.message); }
            finally { btnIcon.innerHTML = `<div class="w-12 h-12 rounded-xl bg-purple-100 text-purple-700 flex items-center justify-center mb-4 border border-purple-200"><i class="fa-solid fa-cloud-arrow-down text-2xl"></i></div>`; }
        }

        function formatDate(dateStr) {
            if(!dateStr) return '';
            try {
                return new Date(dateStr).toLocaleDateString(); 
            } catch(e) { return dateStr; }
        }

        function renderList() {
            const container = document.getElementById('card-list-container');
            if (!container) return;
            container.innerHTML = '';
            const key = document.getElementById('search-bar').value.toLowerCase();
            const filtered = db.filter(c => 
                (c.logo + c.company + c.name + c.note).toLowerCase().includes(key)
            );
            filtered.forEach((c) => {
                const el = document.createElement('div');
                el.className = 'glass p-5 border-l-8 border-slate-400 hover:border-blue-600 transition-colors relative mb-3 cursor-pointer active:scale-98 bg-white shadow-md';
                el.onclick = () => showSingleCard(c.docId);
                
                el.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <div class="text-xl font-extrabold text-slate-800 font-mono tracking-tight">${c.logo || c.company}</div>
                            ${c.logo && c.company && c.logo !== c.company ? `<div class="text-sm font-bold text-slate-500">${c.company}</div>` : ''}
                        </div>
                        <span class="text-xs font-bold px-2 py-1 rounded border-2 ${c.synced ? 'bg-green-100 text-green-700 border-green-300' : 'bg-orange-100 text-orange-700 border-orange-300'}">
                            ${c.synced ? 'SYNCED' : 'LOCAL'}
                        </span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-lg font-bold text-slate-700">${c.name}</div>
                    </div>
                    <button onclick="event.stopPropagation(); goEdit(&quot;${c.docId}&quot;)" class="absolute bottom-5 right-5 text-blue-600 text-sm font-bold uppercase flex items-center gap-2 py-2 px-4 hover:bg-blue-100 rounded-lg border-2 border-blue-200 bg-white">
                        <i class="fa-solid fa-pen"></i> 編輯
                    </button>
                `;
                container.appendChild(el);
            });
        }

        function attachLongPress(el, text) {
            let timer;
            const start = (e) => { 
                timer = setTimeout(() => { 
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('Copied: ' + text); 
                        if(navigator.vibrate) navigator.vibrate(50);
                        el.classList.add('copy-active');
                        setTimeout(()=>el.classList.remove('copy-active'), 200);
                    }).catch(err => {
                        const textArea = document.createElement("textarea");
                        textArea.value = text;
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand("Copy");
                        textArea.remove();
                        showToast('Copied: ' + text);
                    });
                }, 800); 
            }
            const end = () => { clearTimeout(timer); }
            el.addEventListener('touchstart', start);
            el.addEventListener('touchend', end);
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
        }

        function showSingleCard(docId) {
            const c = db.find(x => String(x.docId) === String(docId));
            if (!c) return;

            const container = document.getElementById('single-card-content');
            container.innerHTML = `
                <div class="mb-6 pb-4 border-b-2 border-slate-300">
                    <div class="text-3xl font-extrabold text-slate-900">${c.logo || c.company}</div>
                    <div class="text-sm font-bold text-slate-500 font-mono mt-1">${c.company || ''}</div>
                </div>
                
                <div class="mb-6">
                    <div class="text-2xl font-bold text-slate-800">${c.name}</div>
                    <div class="text-base text-blue-700 font-bold bg-blue-100 inline-block px-3 py-1 rounded-lg mt-1">${c.title || '-'}</div>
                </div>

                <div class="grid gap-4 text-base font-bold text-slate-700 font-mono">
                    ${c.mobile ? `<div id="cp-mobile" class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 active:bg-blue-50 transition-colors cursor-pointer"><i class="fa-solid fa-mobile-screen w-6 text-center text-blue-500 text-xl"></i> ${c.mobile}</div>` : ''}
                    ${c.phone1 ? `<div id="cp-phone1" class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 active:bg-blue-50 transition-colors cursor-pointer"><i class="fa-solid fa-phone w-6 text-center text-blue-500 text-xl"></i> ${c.phone1}</div>` : ''}
                    ${c.phone2 ? `<div id="cp-phone2" class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 active:bg-blue-50 transition-colors cursor-pointer"><i class="fa-solid fa-phone-volume w-6 text-center text-blue-500 text-xl"></i> ${c.phone2}</div>` : ''}
                    ${c.email ? `<div id="cp-email" class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 active:bg-blue-50 transition-colors cursor-pointer"><i class="fa-regular fa-envelope w-6 text-center text-blue-500 text-xl"></i> <span class="break-all">${c.email}</span></div>` : ''}
                    ${c.address1 ? `<div id="cp-addr1" class="flex items-start gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 active:bg-blue-50 transition-colors cursor-pointer"><i class="fa-solid fa-map-pin w-6 text-center text-red-500 text-xl mt-1"></i> <div>${c.address1}</div></div>` : ''}
                    ${c.address2 ? `<div id="cp-addr2" class="flex items-start gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 active:bg-blue-50 transition-colors cursor-pointer"><i class="fa-solid fa-map-location-dot w-6 text-center text-red-500 text-xl mt-1"></i> <div>${c.address2}</div></div>` : ''}
                    <div class="flex items-center gap-2 text-xs text-slate-400 mt-2"><i class="fa-regular fa-clock w-5 text-center"></i> ${formatDate(c.date)}</div>
                </div>
                
                ${c.note ? `<div class="mt-4 pt-4 border-t-2 border-slate-200 text-sm font-mono text-slate-600 bg-slate-50 p-3 rounded-lg"><div class="text-xs text-blue-500 font-bold mb-1">NOTES / RAW DATA</div>${c.note}</div>` : ''}

                <button onclick="confirmDelete(&quot;${c.docId}&quot;)" class="w-full mt-6 py-4 bg-white border-2 border-red-200 text-red-600 font-bold rounded-xl hover:bg-red-50 text-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-trash"></i> 刪除此資產
                </button>
            `;
            
            if(c.mobile) attachLongPress(document.getElementById('cp-mobile'), c.mobile);
            if(c.phone1) attachLongPress(document.getElementById('cp-phone1'), c.phone1);
            if(c.phone2) attachLongPress(document.getElementById('cp-phone2'), c.phone2);
            if(c.email) attachLongPress(document.getElementById('cp-email'), c.email);
            if(c.address1) attachLongPress(document.getElementById('cp-addr1'), c.address1);
            if(c.address2) attachLongPress(document.getElementById('cp-addr2'), c.address2);

            document.getElementById('modal-single-card').classList.remove('hidden');
        }

        function renderLogoWall() {
            const grid = document.getElementById('logo-grid');
            if (!grid) return;
            grid.innerHTML = '';
            const groups = {};
            db.forEach(c => {
                const key = c.logo || c.company || 'NULL';
                if(!groups[key]) groups[key] = [];
                groups[key].push(c);
            });
            Object.keys(groups).forEach(key => {
                const count = groups[key].length;
                const char = key[0].toUpperCase();
                const hue = (char.charCodeAt(0) * 137) % 360;
                
                const el = document.createElement('div');
                el.className = 'glass aspect-square flex flex-col items-center justify-center cursor-pointer hover:bg-blue-50 transition-colors active:scale-95 border-b-8 border-blue-300';
                el.onclick = () => showDetail(key, groups[key]);
                el.innerHTML = `
                    <div class="logo-box mb-3 shadow-lg" style="background:linear-gradient(135deg, hsl(${hue}, 70%, 60%), hsl(${hue}, 70%, 45%))">${char}</div>
                    <div class="text-sm font-extrabold text-center w-full px-2 truncate text-slate-700 font-mono">${key}</div>
                    <div class="text-xs font-bold text-slate-400 font-mono mt-1">${count} 筆</div>
                `;
                grid.appendChild(el);
            });
        }

        // [V16.17 Fix] Expand Detail View for Logo Wall
        function showDetail(title, list) {
            activeGroup = list;
            const titleEl = document.getElementById('detail-title');
            if(titleEl) titleEl.innerText = `GROUP: ${title}`;
            
            const content = document.getElementById('detail-content');
            if(!content) return;
            
            content.innerHTML = '';
            list.forEach(c => {
                const el = document.createElement('div');
                el.className = 'bg-white p-4 rounded-xl border-2 border-slate-200 shadow-md mb-4 relative';
                // 使用與 showSingleCard 相同的完整版面
                el.innerHTML = `
                    <button onclick="confirmDelete(&quot;${c.docId}&quot;)" class="absolute top-3 right-3 text-slate-300 hover:text-red-500 transition-colors p-2 bg-slate-50 rounded-lg">
                        <i class="fa-solid fa-trash text-xl"></i>
                    </button>
                    <div class="font-extrabold text-slate-800 text-xl pr-10">${c.name}</div>
                    <div class="text-sm font-bold text-blue-600 mb-2">${c.title || '-'}</div>
                    <div class="text-sm font-bold text-slate-500 border-b-2 border-slate-100 pb-2 mb-3">${c.company}</div>
                    
                    <div class="grid gap-3 text-sm font-bold text-slate-600 font-mono">
                         ${c.mobile ? `<div class="flex items-center gap-2"><i class="fa-solid fa-mobile-screen w-5 text-center text-slate-400"></i> ${c.mobile}</div>` : ''}
                         ${c.phone1 ? `<div class="flex items-center gap-2"><i class="fa-solid fa-phone w-5 text-center text-slate-400"></i> ${c.phone1}</div>` : ''}
                         ${c.phone2 ? `<div class="flex items-center gap-2"><i class="fa-solid fa-phone-volume w-5 text-center text-slate-400"></i> ${c.phone2}</div>` : ''}
                         ${c.email ? `<div class="flex items-center gap-2"><i class="fa-regular fa-envelope w-5 text-center text-slate-400"></i> <span class="truncate">${c.email}</span></div>` : ''}
                         ${c.address1 ? `<div class="flex items-start gap-2"><i class="fa-solid fa-map-pin w-5 text-center text-slate-400 mt-1"></i> <div>${c.address1}</div></div>` : ''}
                         ${c.address2 ? `<div class="flex items-start gap-2"><i class="fa-solid fa-map-location-dot w-5 text-center text-slate-400 mt-1"></i> <div>${c.address2}</div></div>` : ''}
                    </div>
                    ${c.note ? `<div class="mt-3 pt-3 border-t-2 border-slate-100 text-xs text-slate-500 italic bg-slate-50 p-2 rounded">${c.note}</div>` : ''}
                `;
                content.appendChild(el);
            });
            document.getElementById('modal-detail').classList.remove('hidden');
        }

        function closeDetail() { document.getElementById('modal-detail').classList.add('hidden'); }

        function exportCurrentGroup() {
            const title = document.getElementById('detail-title').innerText.replace('GROUP: ', '');
            const csvContent = "\uFEFFLogo,Company,Name,Title,Mobile,Phone1,Phone2,Email,Address1,Address2,Note,Date\n" +
                activeGroup.map(c => 
                    [c.logo, c.company, c.name, c.title, c.mobile, c.phone1, c.phone2, c.email, c.address1, c.address2, c.note, c.date]
                    .map(v => `"${(v||'').replace(/"/g, '""')}"`).join(',')
                ).join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `DataSet_${title}.csv`;
            a.click();
        }

        function updateStats() {
            const elTotal = document.getElementById('stat-total');
            const elUnsync = document.getElementById('stat-unsync');
            const elBar = document.getElementById('stat-bar');
            if(!elTotal || !elUnsync || !elBar) return;
            elTotal.innerText = db.length;
            const unsyncCount = db.filter(c => !c.synced).length;
            elUnsync.innerText = unsyncCount;
            const percent = db.length > 0 ? ((db.length - unsyncCount) / db.length) * 100 : 0;
            elBar.style.width = `${percent}%`;
            elBar.className = `h-full transition-all duration-1000 ${percent === 100 ? 'bg-green-500' : 'bg-blue-500'}`;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => { t.classList.remove('show'); }, 3000);
        }
    </script>
</body>
